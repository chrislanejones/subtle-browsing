<!doctype html><html><head><meta charset="utf-8"></head><body style="background:#cdf">
<button id="go">load big file</button> <span id="got"></span>
<script>
  // Downloads 5 MB, past the extension's 4 MB heavy ad limit
  const load = () => fetch('/big.bin?' + Math.random()).then((r) => r.arrayBuffer())
    .then((b) => { document.getElementById('got').textContent = String(b.byteLength); });
  if (location.search === '?wait') document.getElementById('go').onclick = load; else load();
</script></body></html>
