<!doctype html><html><head><meta charset="utf-8"></head><body style="background:#cdf"><span id="got"></span>
<script>
  // 2.5 MB: under the limit on its own
  fetch('/half.bin?' + Math.random()).then((r) => r.arrayBuffer())
    .then((b) => { document.getElementById('got').textContent = String(b.byteLength); });
</script></body></html>
