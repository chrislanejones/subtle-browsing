<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0">
<video id="v" src="/clip.webm" muted autoplay loop width="160"></video>
<script>
  // A worst-case ad player: calls play() again the moment it's paused
  window.plays = 0;
  const v = document.getElementById('v');
  v.addEventListener('play', () => plays++);
  v.addEventListener('pause', () => v.play().catch(() => {}));
</script>
</body></html>
