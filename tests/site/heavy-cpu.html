<!doctype html><html><head><meta charset="utf-8"></head><body style="background:#fdc">busy <span id="ticks">0</span>
<script>
  // 200 ms busy every 250 ms: an ad pegging one core
  let ticks = 0;
  setInterval(() => {
    const end = performance.now() + 200;
    while (performance.now() < end) {}
    document.getElementById('ticks').textContent = String(++ticks);
  }, 250);
</script></body></html>
