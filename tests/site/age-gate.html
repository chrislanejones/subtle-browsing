<!doctype html>
<html lang="en" style="overflow: hidden">
  <head>
    <meta charset="utf-8" />
    <title>Age gate fixture</title>
    <style>
      body { margin: 0; overflow: hidden; }
      main { min-height: 2500px; padding: 40px; }
      #overlay { position: fixed; inset: 0; background: #eee; z-index: 10; }
      .modal-backdrop { position: fixed; inset: 0; background: #888; z-index: 9; }
      #age_gate_home { padding: 30px; }
    </style>
  </head>
  <body>
    <main><button id="content">Page content</button><output id="clicks">0</output></main>
    <div class="modal-backdrop" id="backdrop-before"></div>
    <div id="overlay">
      <!-- The supplied gate structure, with no verification token or remote assets. -->
      <div id="age_gate_home" class="multi-av">
        <div class="header"><strong class="explicit" data-testid="age-gate-header">Verify your age</strong></div>
        <span id="age-gate-visitor-text" data-testid="age-gate-visitor-text">Visitors in Florida must verify their age to access Chaturbate.</span>
        <div id="av-choices">
          <div class="method-div">
            <div id="email-vfy" class="choice-div no-height highlight" data-testid="email-verify-option">
              <div class="left-half"><input type="radio" id="choice-verifymy-email" name="av-choice" value="verifymy-email" /></div>
              <div class="right-half with-help-text"><label for="choice-verifymy-email">Email</label></div>
            </div>
          </div>
          <div class="method-div" style="display: none"><div id="id-scan-div" class="choice-div"><input type="radio" id="choice-incode-id" name="av-choice" value="incode-id" /><label for="choice-incode-id">ID Scan</label></div></div>
          <div class="method-div" style="display: none"><div id="yoti-div" class="choice-div"><input type="radio" id="choice-yoti" name="av-choice" value="yoti" /><label for="choice-yoti">Yoti</label></div></div>
          <a class="show-more-verification-options" href="#">Other verification methods</a>
        </div>
        <a id="av-choice-submit" class="nooverlay" data-testid="age-gate-verify" href="/agegate/verifymy/">Confirm Age</a>
        <span class="age-gate-account under-modal"><a href="/auth/login/" class="login-link nooverlay">Sign in with a verified account</a></span>
      </div>
    </div>
    <div class="modal-backdrop" id="backdrop-after"></div>
    <div id="unrelated" role="dialog" hidden>Sign in</div>
    <script>
      document.getElementById("content").onclick = () => {
        document.getElementById("clicks").textContent++;
      };
    </script>
  </body>
</html>
