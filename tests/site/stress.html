<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0">
<video id="pingpong" src="/clip.webm" muted autoplay loop width="160"></video>
<!-- The padding is the only spot where #huge itself is the topmost element -->
<div id="huge" style="width:600px;padding:20px;background:#eef"><div id="grid" style="height:400px;overflow:hidden"></div></div>
<script>
  // Worst-case ad player: restarts the moment it's paused
  window.playEvents = 0;
  const v = document.getElementById('pingpong');
  v.addEventListener('play', () => window.playEvents++);
  v.addEventListener('pause', () => v.play().catch(() => {}));

  // 20,000 elements, some with background images and data- URLs
  const grid = document.getElementById('grid');
  const frag = document.createDocumentFragment();
  for (let i = 0; i < 20000; i++) {
    const d = document.createElement('div');
    d.style.cssText = `width:4px;height:4px;float:left;${i % 50 === 0 ? `background-image:url(/ok.png?${i})` : ''}`;
    if (i % 100 === 0) d.dataset.src = `https://ads.example-network.com/pixel/${i}`;
    frag.append(d);
  }
  grid.append(frag);

  window.longTasks = [];
  new PerformanceObserver((list) => list.getEntries().forEach((e) => window.longTasks.push(Math.round(e.duration))))
    .observe({ type: 'longtask', buffered: true });
</script>
</body></html>
